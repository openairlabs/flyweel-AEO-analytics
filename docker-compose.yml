services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: citations_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules
      - pnpm_store:/app/.pnpm-store
      - web_next:/app/web/.next
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/citations_tracker
      CI: "true"
    command: >
      sh -c "corepack enable && pnpm install && pnpm --filter web db:migrate && pnpm --filter web db:seed"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules
      - pnpm_store:/app/.pnpm-store
      - web_next:/app/web/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/citations_tracker
    env_file:
      - .env
    command: sh -c "corepack enable && pnpm install && pnpm --filter web dev"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  node_modules:
  web_node_modules:
  pnpm_store:
  web_next:
